<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="cartoon.png">
    <title>Attensia - Video Meetings</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="lobby-body">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="Attensia Logo" class="nav-logo">
            <!-- <span class="nav-title">Attensia</span> -->
        </div>
        <div class="nav-right">
            <span id="currentTime" class="nav-time"></span>
            <span id="currentDate" class="nav-date"></span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="hero-container">
        <!-- Left Side: Text and Actions -->
        <div class="hero-content">
            <h1 class="hero-title">Attensia video meetings.<br><span class="highlight">For Better
                    Meetings.</span></h1>
            <p class="hero-subtitle">Connect, collaborate, and celebrate from anywhere with Attensia.</p>

            <div class="action-group">
                <button class="btn-primary" onclick="createRoom()">
                    <i class="fa-solid fa-video"></i> New Meeting
                </button>
                <div class="join-group">
                    <div class="input-wrapper">
                        <i class="fa-solid fa-keyboard"></i>
                        <input type="text" id="roomCodeInput" placeholder="Enter a code or link"
                            oninput="toggleJoinBtn()" onkeypress="handleJoinKeypress(event)">
                    </div>
                    <button class="btn-secondary" id="joinBtn" onclick="joinRoomFromInput()" disabled>Join</button>
                </div>
            </div>

            <div class="divider"></div>
            <p class="learn-more">© 2026 <a href="#">Ahmadan Fatrah</a></p>
        </div>

        <!-- Right Side: Graphic -->
        <div class="hero-graphic">
            <div class="graphic-glow"></div>
            <img src="cartoon.png" alt="Video Conference Graphic" class="floating-cartoon">
        </div>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="popup">
        <div class="modal">
            <div class="modal-header">
                <h3 id="popupTitle">Enter Details</h3>
                <button class="close-btn" onclick="closePopup()"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="input-field">
                    <label for="nameInput">Your Name</label>
                    <input type="text" id="nameInput" placeholder="e.g. John Doe" autocomplete="off">
                </div>
                <!-- Hidden by default, shown if joining without code -->
                <div class="input-field" id="roomInputField" style="display:none;">
                    <label for="roomInput">Room Code</label>
                    <input type="text" id="roomInput" placeholder="e.g. abc-defg-hij" autocomplete="off">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closePopup()">Cancel</button>
                <button class="btn-submit" onclick="submitPopup()">Continue <i
                        class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let mode = ""; // create / join

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('roomCodeInput').value = roomParam;
                toggleJoinBtn();
                joinRoomFromInput();
            }
        };

        // Clock Update
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;

            const timeString = hours + ':' + minutes + ' ' + ampm;

            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            const dateString = now.toLocaleDateString('en-US', options);

            document.getElementById('currentTime').innerText = timeString;
            document.getElementById('currentDate').innerText = '• ' + dateString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Join button state
        function toggleJoinBtn() {
            const input = document.getElementById('roomCodeInput').value.trim();
            const btn = document.getElementById('joinBtn');
            if (input.length > 0) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }

        function handleJoinKeypress(e) {
            if (e.key === "Enter") {
                const input = document.getElementById('roomCodeInput').value.trim();
                if (input.length > 0) {
                    joinRoomFromInput();
                }
            }
        }

        function createRoom() {
            mode = "create";
            document.getElementById('popupTitle').innerText = "Create New Meeting";
            document.getElementById('roomInputField').style.display = "none";
            document.getElementById('roomInput').value = ""; // Clear
            openPopup();
        }

        function joinRoomFromInput() {
            mode = "join";
            const code = document.getElementById('roomCodeInput').value.trim();
            document.getElementById('popupTitle').innerText = "Join Meeting";

            if (code) {
                // If user entered code in the hero section, pre-fill and hide it in modal
                document.getElementById('roomInput').value = code;
                document.getElementById('roomInputField').style.display = "none";
            } else {
                document.getElementById('roomInputField').style.display = "block";
            }
            openPopup();
        }

        function openPopup() {
            document.getElementById('popup').style.display = "flex";
            setTimeout(() => {
                document.getElementById('nameInput').focus();
            }, 100);
        }

        function closePopup() {
            document.getElementById('popup').style.display = "none";
        }

        async function submitPopup() {
            const name = document.getElementById('nameInput').value.trim();
            let room = document.getElementById('roomInput').value.trim().toLowerCase();
            let role = 'participant';

            if (!name) {
                alert("Please enter your name.");
                document.getElementById('nameInput').focus();
                return;
            }

            if (mode === "create") {
                room = Math.random().toString(36).substring(2, 8);
                role = 'moderator';
                // Simpan kepemilikan ruangan ke local storage
                localStorage.setItem('createdRoom', room);
            } else {
                if (!room) {
                    alert("Please enter a Room Code");
                    return;
                }

                // Auto-claim Host jika ini adalah ruangan yang dia buat sebelumnya
                if (room === localStorage.getItem('createdRoom')) {
                    role = 'moderator';
                }

                // Show loading state on button
                const btnSubmit = document.querySelector('.btn-submit');
                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Joining...';
                btnSubmit.disabled = true;

                try {
                    const res = await fetch(`/check-room?room=${room}`);
                    if (!res.ok) {
                        console.warn("API check-room tidak ditemukan. Harap restart server Node.js Anda.");
                        // Lanjutkan saja jika API belum ada (graceful fallback)
                    } else {
                        try {
                            const data = await res.json();
                            if (!data.exists) {
                                alert("Gagal bergabung: Room tidak ditemukan atau belum dibuat.");
                                btnSubmit.innerHTML = originalText;
                                btnSubmit.disabled = false;
                                return;
                            }
                        } catch (jsonErr) {
                            console.warn("Bukan respons JSON (kemungkinan menggunakan Live Server), mengabaikan pengecekan.");
                        }
                    }
                } catch (e) {
                    console.error("Gagal mengecek room", e);
                    alert("Terjadi kesalahan jaringan saat mengecek room.");
                    btnSubmit.innerHTML = originalText;
                    btnSubmit.disabled = false;
                    return;
                }
            }

            // Simpan ke sessionStorage agar tidak terekspos di URL
            sessionStorage.setItem('meeting_name', name);
            sessionStorage.setItem('meeting_role', role);

            // Arahkan ke clean room URL
            location.href = `/${room}`;
        }

        // Enter key support for modal
        document.getElementById('popup').addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                if (this.style.display === "flex") {
                    submitPopup();
                }
            }
        });

        // Close modal on escape key
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                const popup = document.getElementById('popup');
                if (popup.style.display === "flex") {
                    closePopup();
                }
            }
        });
    </script>
</body>

</html>
