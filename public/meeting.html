<!DOCTYPE html>
<html>

<head>
    <title>Meeting Room</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css?v=3">

    <script src="/socket.io/socket.io.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script> -->
    <script src="/mediapipe/face_mesh.js"></script>
</head>

<body>
    <!-- Real-time Monitoring Panel -->
    <!-- <div id="monitorPanel" class="monitor-panel">
        <div class="monitor-item">
            <span><i class="fas fa-tachometer-alt"></i> FPS</span>
            <span id="valFPS">0</span>
        </div>
        <div class="monitor-item">
            <span><i class="fas fa-network-wired"></i> Latency</span>
            <span id="valLatency">0 ms</span>
        </div>
        <div class="monitor-item">
            <span><i class="fas fa-microchip"></i> CPU</span>
            <span id="valCPU">0%</span>
        </div>
        <div class="monitor-item">
            <span><i class="fas fa-memory"></i> RAM</span>
            <span id="valRAM">0 MB</span>
        </div>
    </div> -->
    <div id="mainStage"></div>
    <div id="videos"></div>
    <div id="focusNotif" class="focus-notif" style="display: none;"></div>
    <div id="toastNotif" class="toast-notif" style="display: none;"></div>
    <div id="controls">
        <h3 id="info"></h3>
        <button id="micBtn" class="control-btn" title="Mute/Unmute">
            <i class="fas fa-microphone"></i>
        </button>
        <button id="camBtn" class="control-btn" title="Camera On/Off">
            <i class="fas fa-video"></i>
        </button>
        <button id="shareBtn" class="control-btn" title="Share Screen">
            <i class="fas fa-desktop"></i>
        </button>
        <div style="position: relative;">
            <button id="moreOptionsBtn" class="control-btn" title="More Options">
                <i class="fas fa-ellipsis-v"></i>
            </button>
            <div id="optionsMenu" class="options-menu">
                <div id="cameraSelectContainer" class="menu-item camera-menu-item" style="display: none;">
                    <i class="fas fa-camera"></i>
                    <select id="cameraSelect" class="camera-select-dropdown" title="Pilih Kamera"></select>
                </div>
                <button id="participantsBtnMenu" class="menu-item"><i class="fas fa-user-friends"></i>
                    Participants</button>
                <button id="summaryBtnMenu" class="menu-item moderator-only" style="display: none;"><i
                        class="fas fa-chart-bar"></i> Attention Summary</button>
            </div>
        </div>
        <button id="leaveBtn" class="control-btn leave-btn" title="End Call">
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>

    <!-- Participants Sidebar -->
    <div id="participantsSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3 id="participantsCount">Participants (0)</h3>
            <div class="header-actions">
                <button class="icon-btn" title="Pop out"><i class="fas fa-external-link-alt"></i></button>
                <button class="icon-btn" id="closeSidebarBtn" title="Close"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="sidebar-search">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="participantSearch" placeholder="Find a participant">
        </div>
        <div id="participantsList" class="participants-list">
            <!-- List goes here -->
        </div>
    </div>

    <!-- Paginasi Button -->
    <button id="prevPageBtn" class="page-btn" style="display: none;" title="Previous Page">
        <i class="fas fa-chevron-left"></i>
    </button>
    <button id="nextPageBtn" class="page-btn" style="display: none;" title="Next Page">
        <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Summary Sidebar -->
    <div id="summarySidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Attention Summary</h3>
            <div class="header-actions">
                <button class="icon-btn" id="downloadSummaryBtn" title="Download CSV"><i
                        class="fas fa-download"></i></button>
                <button class="icon-btn" id="closeSummarySidebarBtn" title="Close"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div id="summaryList" class="participants-list">
            <!-- Data disuntikkan dari meeting.js -->
        </div>
    </div>

    <script src="/meeting.js?v=3"></script>
</body>

</html>
